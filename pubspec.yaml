name: bilipure
description: "BiliPure - 一个轻量的第三方哔哩哔哩客户端"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  crypto: ^3.0.6
  provider: ^6.1.5
  cached_network_image: ^4.0.6
  video_player: ^2.14.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_ios_video: ^1.1.4
  # 锁定到 2.12.1：2.12.2+ 的 Swift 源码使用了 `isolation:` 参数（Swift 6.2 API），
  # 在 GitHub Actions macos runner 自带的 Xcode 上会报
  # "Extra argument 'isolation' in call" 导致编译失败。
  video_player_avfoundation: 2.12.1
  shared_preferences: ^2.5.6
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
